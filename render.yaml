services:
  - type: web
    name: hedwig-qds-v2
    runtime: python
    rootDir: v2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: HEDWIG_BACKEND
        value: qiskit
